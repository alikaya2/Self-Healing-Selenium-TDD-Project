healenium.enabled = true

healenium.score.threshold = 0.7
! Accuracy rate for %

healenium.retry.count = 3
healenium.recovery.tries = 3

healenium.screenshot.path = target/healenium/screenshots

healenium.report.path = target/healenium/reports
!Test report folder path

chrome.options = --no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1920,1080

healenium.log.level = DEBUG
healenium.log.file = target/healenium/logs/healenium.log

healenium.performance.mode = true
healenium.memory.optimization = true

healenium.environment = local
healenium.browser = chrome

healenium.server.url = http://localhost:7878/healenium
healenium.server.url.backup = http://localhost:7878/healeniumitate
healenium.imitate.url = http://localhost:8000/imitate

healenium.debug.enabled = false
healenium.debug = false

healenium.error.retry.count = 3
healenium.error.timeout = 10000
